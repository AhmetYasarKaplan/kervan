name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Java 21 verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify
        run: ./gradlew clean check

      - name: Verify published starter from independent consumer
        shell: bash
        run: |
          smoke_repo="$RUNNER_TEMP/kervan-consumer-repo"
          mkdir -p "$smoke_repo"
          ./gradlew "-Dmaven.repo.local=$smoke_repo" publishToMavenLocal
          version="$(sed -n 's/^version=//p' gradle.properties)"
          ./gradlew -p smoke/consumer "-PkervanVersion=$version" \
            "-PkervanSmokeRepository=$smoke_repo" check

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports
          path: |
            kervan-*/build/reports/
            kervan-*/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
